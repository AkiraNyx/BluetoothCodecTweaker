name: Build MSIX

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

env:
  PROJECT_PATH: src/BluetoothCodecTweaker/BluetoothCodecTweaker.csproj
  PUBLISHER: CN=AkiraNyx

jobs:
  build:
    strategy:
      matrix:
        platform: [x64]
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Import signing certificate
      run: |
        $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
        $pfxPath = "${{ github.workspace }}\signing.pfx"
        [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

        $password = ConvertTo-SecureString -String "${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}" -Force -AsPlainText
        $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password
        echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

        Remove-Item $pfxPath
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }} -p:Platform=${{ matrix.platform }} -p:PublishReadyToRun=true

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -p:Platform=${{ matrix.platform }} -c ${{ matrix.configuration }} --no-restore

    - name: Create MSIX package
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          -p:Platform=${{ matrix.platform }} `
          -c ${{ matrix.configuration }} `
          -p:AppxPackageDir=..\..\artifacts\${{ matrix.platform }}\ `
          -p:GenerateAppxPackageOnBuild=true `
          -p:AppxBundle=Never `
          -p:AppxPackageSigningEnabled=true `
          -p:PackageCertificateThumbprint=${{ env.CERT_THUMBPRINT }}
      shell: pwsh

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: BluetoothCodecTweaker-${{ matrix.platform }}-${{ matrix.configuration }}
        path: artifacts/${{ matrix.platform }}/**/*.msix
        if-no-files-found: warn
